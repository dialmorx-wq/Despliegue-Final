<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<title>Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

body{
    background:#f4f6f9;
}

.sidebar{
    width:250px;
    height:100vh;
    background:#212529;
    position:fixed;
    padding-top:20px;
}

.sidebar h2{
    color:white;
    text-align:center;
    margin-bottom:30px;
}

.sidebar a{
    color:#adb5bd;
    text-decoration:none;
    display:block;
    padding:15px;
}

.sidebar a:hover{
    background:#343a40;
    color:white;
}

.content{
    margin-left:250px;
    padding:20px;
}

.card-dashboard{
    border:none;
    border-radius:15px;
    box-shadow:0px 2px 10px rgba(0,0,0,0.1);
}

</style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <h2>SGA_RPF</h2>

    <a href="#">
        <i class="bi bi-house"></i>
        Inicio
    </a>

    <a th:href="@{/}">
  	 	 <i class="bi bi-people"></i>
   		 Usuarios
	</a>

    <a href="#">
        <i class="bi bi-bar-chart"></i>
        Reportes
    </a>
	
	<a th:href="@{/logout}">
   		 <i class="bi bi-box-arrow-right"></i>
    		Cerrar Sesión
</a>
</div>

<!-- CONTENIDO -->

<div class="content">

    <h1 class="mb-4">
       Bienvenido
		<span th:text="${usuario.nombre}"></span>
    </h1>

    <div class="row">

        <div class="col-md-4">

            <div class="card card-dashboard bg-primary text-white">

                <div class="card-body">

                    <h5>Usuarios</h5>

                    <h2>120</h2>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card card-dashboard bg-success text-white">

                <div class="card-body">

                    <h5>Reportes</h5>

                    <h2>35</h2>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card card-dashboard bg-dark text-white">

                <div class="card-body">

                    <h5>Instituciones</h5>

                    <h2>18</h2>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
