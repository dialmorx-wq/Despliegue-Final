<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Sistema Gestión Usuarios</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

<div class="container mt-5">

		<div class="d-flex justify-content-end mb-3">

  		  <a th:href="@{/logout}"
 	      class="btn btn-danger">

  	      Cerrar Sesión

  		</a>

</div>


	<!-- ALERTA SUCCESS -->
<div th:if="${success}"
     class="alert alert-success alert-dismissible fade show"
     role="alert">

    <span th:text="${success}"></span>

    <button type="button"
            class="btn-close"
            data-bs-dismiss="alert">
    </button>

	</div>
	
	<!-- ALERTA DANGER -->
	<div th:if="${danger}"
	     class="alert alert-danger alert-dismissible fade show"
	     role="alert">
	
	    <span th:text="${danger}"></span>
	
	    <button type="button"
	            class="btn-close"
	            data-bs-dismiss="alert">
	    </button>
	
	</div>

    <!-- FORMULARIO -->
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">

    <h3 class="mb-0">
        Sistema Gestión Usuarios
    </h3>

    <a th:href="@{/nuevo}"
       class="btn btn-light btn-sm">

        <i class="bi bi-plus-circle"></i>
        Nuevo Usuario

    </a>

</div>

        <div class="card-body">

            <form th:action="@{/guardar}"
                  th:object="${usuario}"
                  method="post">

                <!-- ID oculto -->
                <input type="hidden" th:field="*{id}">

                <!-- NOMBRE -->
                <div class="mb-3">

                    <label class="form-label">
                        Nombre
                    </label>

                    <input type="text"
                           th:field="*{nombre}"
                           class="form-control"
                           placeholder="Ingrese nombre">

                    <div class="invalid-feedback d-block"
                         th:if="${#fields.hasErrors('nombre')}"
                         th:errors="*{nombre}">
                    </div>

                </div>

                <!-- CORREO -->
                <div class="mb-3">

                    <label class="form-label">
                        Correo
                    </label>

                    <input type="email"
                           th:field="*{correo}"
                           class="form-control"
                           placeholder="Ingrese correo">

                    <div class="invalid-feedback d-block"
                         th:if="${#fields.hasErrors('correo')}"
                         th:errors="*{correo}">
                    </div>

                </div>

                <!-- PASSWORD -->
                <div class="mb-3">

                    <label class="form-label">
                        Contraseña
                    </label>

                    <input type="password"
                           th:field="*{password}"
                           class="form-control"
                           placeholder="Ingrese contraseña">

                    <div class="invalid-feedback d-block"
                         th:if="${#fields.hasErrors('password')}"
                         th:errors="*{password}">
                    </div>

                </div>

                <!-- BOTÓN -->
                <button type="submit"
                        class="btn btn-success w-100">

                    <i class="bi bi-save"></i>
                    Guardar Usuario

                </button>

            </form>

        </div>

    </div>

    <!-- TABLA -->
    <div class="card mt-4 shadow">

        <div class="card-header bg-dark text-white">
            <h4 class="mb-0">
                Lista de Usuarios
            </h4>
        </div>

        <div class="card-body">

            <table class="table table-bordered table-hover align-middle">

                <thead class="table-primary">

                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Acciones</th>
                    </tr>

                </thead>

                <tbody>

                    <tr th:each="usuario : ${listaUsuarios}">

                        <td th:text="${usuario.id}"></td>

                        <td th:text="${usuario.nombre}"></td>

                        <td th:text="${usuario.correo}"></td>

                        <td>

                            <!-- EDITAR -->
                            <a th:href="@{/editar/{id}(id=${usuario.id})}"
                               class="btn btn-warning btn-sm">

                                <i class="bi bi-pencil-square"></i>
                                Editar

                            </a>

                            <!-- ELIMINAR -->
						                            <a th:href="@{/eliminar/{id}(id=${usuario.id})}"
						   class="btn btn-danger btn-sm"
						   onclick="return confirm('¿Seguro que deseas eliminar este usuario?')">
						
						    <i class="bi bi-trash"></i>
						    Eliminar
						
						</a>
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
